name: Bug Report
description: Report a bug in the Windows, Linux, or Android client
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with **PVE Command Center Clients**. Please share as much detail as possible so we can reproduce it.
  - type: dropdown
    id: platform
    attributes:
      label: Client Platform
      options:
        - Windows (Tauri v2)
        - Linux (Tauri v2 AppImage / deb)
        - Android (Capacitor 8)
        - Web UI (Vite dev / preview)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Client & Server Versions
      description: Client version and target PVE Panel server version
      placeholder: "Client v1.0.0 / Server v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection Mode
      options:
        - Tailscale Serve (HTTPS)
        - Local LAN (HTTP / IP)
        - Interactive Demo Mode
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open Server Configuration
        2. Connect to ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Console Output
      render: shell
